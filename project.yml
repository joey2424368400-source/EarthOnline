name: EarthOnline
options:
  bundleIdPrefix: com.earthonline
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"

targets:
  EarthOnline:
    type: application
    platform: iOS
    sources:
      - path: EarthOnline
    settings:
      base:
        INFOPLIST_FILE: EarthOnline/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.earthonline.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
